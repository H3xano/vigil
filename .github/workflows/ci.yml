name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit; the comment is the release the SHA belongs to.
# Rust comes from core/rust-toolchain.toml (rustup is preinstalled on the runner).

jobs:
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Engine end-to-end (unprivileged network namespace)
        working-directory: .
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get install -y dnsutils
          scripts/e2e-netns.sh
      - name: JNI smoke test
        working-directory: .
        run: scripts/jni-smoke.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - name: RustSec advisories for the engine's dependencies
        run: cargo audit --file core/Cargo.lock

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - run: rustup toolchain install
        working-directory: core
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Android SDK packages
        # The runner image ships an SDK in $ANDROID_HOME; add the pinned NDK and platform.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
      - name: Build, lint and unit-test
        working-directory: android
        # Unsigned: CI has no release key, and a debug-signed "release" APK would be misleading.
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease -Pvigil.unsignedRelease=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vigil-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
