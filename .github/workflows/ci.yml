name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Engine end-to-end (unprivileged network namespace)
        working-directory: .
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get install -y dnsutils
          scripts/e2e-netns.sh
      - name: JNI smoke test
        working-directory: .
        run: scripts/jni-smoke.sh

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --locked
      - name: Android SDK packages
        # The runner image ships an SDK in $ANDROID_HOME; add the pinned NDK and platform.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Build, lint and unit-test
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-apk
          path: android/app/build/outputs/apk/release/*.apk
