name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit; the comment is the release the SHA belongs to.
# Rust comes from core/rust-toolchain.toml (rustup is preinstalled on the runner).

jobs:
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Engine end-to-end (unprivileged network namespace)
        working-directory: .
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get install -y dnsutils
          scripts/e2e-netns.sh
      - name: JNI smoke test
        working-directory: .
        run: scripts/jni-smoke.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
      - name: RustSec advisories for the engine's dependencies
        run: cargo audit --file core/Cargo.lock

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 17
      - run: rustup toolchain install
        working-directory: core
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Android SDK packages
        # The runner image ships an SDK in $ANDROID_HOME; add the pinned NDK and platform.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
      - name: Build, lint and unit-test
        working-directory: android
        # Unsigned: CI has no release key, and a debug-signed "release" APK would be misleading.
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease -Pvigil.unsignedRelease=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vigil-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
