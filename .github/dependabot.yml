# Weekly update PRs. Rust and Android toolchain pins (rust-toolchain.toml,
# NDK, AGP) are also pinned in the F-Droid recipe: bump them together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
