[workspace]
resolver = "2"
members = ["vigil-core", "vigil-jni", "vigil-cli"]
# Vendored third-party crates are patched in below, not workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/H3xano/vigil"
rust-version = "1.80"

[workspace.dependencies]
vigil-core = { path = "vigil-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures = "0.3"
netstack-smoltcp = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
parking_lot = "0.12"
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# Encrypted upstream DNS (DoT/DoH). ring, not aws-lc-rs: no C/cmake cross
# build for Android, and simpler reproducible builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# DoH over HTTP/2 (Quad9 and Mullvad refuse HTTP/1.1).
h2 = "0.4"
http = "1"
bytes = "1"
# Upstream chaining (engine/upstream): WireGuard Noise/crypto (BSD-3-Clause),
# a client-side smoltcp stack for the tunnel (same version netstack-smoltcp
# uses; "async" adds socket wakers), and base64 for WireGuard keys.
boringtun = { version = "0.7.1", default-features = false }
smoltcp = { version = "0.12", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "async"] }
base64 = "0.22"

# netstack-smoltcp has no way to abort a connection (so resets would reach
# apps as FINs) and reports peer resets as EOF. vendor/netstack-smoltcp adds
# both; see the header of its Cargo.toml.
[patch.crates-io]
netstack-smoltcp = { path = "vendor/netstack-smoltcp" }
# boringtun builds staticlib + cdylib too, which cargo-ndk would ship as a
# stray .so; vendor/boringtun is the same source built as an rlib only.
boringtun = { path = "vendor/boringtun" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
strip = "symbols"

# TLS and HTTP/2 only carry DNS lookups: optimise them for size (saves
# about 130 KB per ABI; the packet path keeps opt-level 3).
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.ring]
opt-level = "s"
[profile.release.package.rustls-webpki]
opt-level = "s"
[profile.release.package.tokio-rustls]
opt-level = "s"
[profile.release.package.h2]
opt-level = "s"
[profile.release.package.http]
opt-level = "s"
[profile.release.package.indexmap]
opt-level = "s"
