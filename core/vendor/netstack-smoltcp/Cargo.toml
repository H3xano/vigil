# Vendored copy of netstack-smoltcp 0.2.4 (MIT OR Apache-2.0) with a small
# vigil patch in src/tcp.rs (every change is marked "vigil patch"):
#   * TcpStream::abort / TcpAbortHandle: abort the connection, so smoltcp
#     sends a RST instead of a FIN;
#   * a connection reset by the peer (or timed out) surfaces as
#     ErrorKind::ConnectionReset from reads and writes instead of EOF;
#   * shutdown() completes once the FIN is queued (not at CLOSED), and
#     sockets leave TIME-WAIT after 1 s instead of smoltcp's 10 s;
#   * a socket that smoltcp puts back into LISTEN (RST in SYN-RECEIVED) or
#     that stays in LISTEN is reaped as reset; SYN|RST creates no socket;
#   * TcpAbortHandle::closed() resolves when the connection is gone.
# The upstream crate's dev-dependencies, examples and tests are omitted.
# To rebase onto a newer release, diff src/ against the published crate.
[package]
name = "netstack-smoltcp"
version = "0.2.4"
edition = "2021"
authors = ["cavivie <cavivie@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cavivie/netstack-smoltcp"
description = "netstack-smoltcp 0.2.4 with vigil's TCP abort/reset patch"
rust-version = "1.75.0"
publish = false

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.10"
etherparse = "0.16"
futures = "0.3"
rand = "0.8"
spin = "0.9"
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
] }
